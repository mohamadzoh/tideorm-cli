name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  fmt:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tideorm-cli
        uses: actions/checkout@v6
        with:
          path: tideorm-cli

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tideorm-cli

      - name: Run clippy
        working-directory: tideorm-cli
        run: cargo clippy --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest

    # `db wipe` reads each server's catalog its own way, so its tests run against
    # real servers; each creates a database of its own there and drops it after.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mariadb:
        image: mariadb:lts
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "1"
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout tideorm-cli
        uses: actions/checkout@v6
        with:
          path: tideorm-cli

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tideorm-cli

      # `tests/generated_project.rs` scaffolds projects into a tempdir and runs
      # `cargo check --offline` inside them, so every dependency of a scaffolded
      # project, not only the CLI's own, has to be in the registry cache before the
      # suite starts: the scaffold asks for more (`tokio` with `full`) than the CLI
      # builds with. Scaffold one project per driver and fetch its dependencies.
      - name: Warm the cargo registry cache
        working-directory: tideorm-cli
        env:
          TIDEORM_NONINTERACTIVE: "1"
        run: |
          cargo fetch
          for driver in sqlite postgres mysql; do
            project="$RUNNER_TEMP/warm-$driver"
            cargo run --quiet -- init "$project" --database "$driver"
            cargo fetch --manifest-path "$project/Cargo.toml"
          done

      - name: Run tests
        working-directory: tideorm-cli
        env:
          TIDEORM_CLI_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
          TIDEORM_CLI_MARIADB_URL: mysql://root@127.0.0.1:3306/mysql
        run: cargo test
